<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Feliz Cumpleaños!</title>
  <!-- Fuentes elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Librerías 3D (Three.js) y Confeti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background-color: #fce4ec;
      background-image: url('Fondo-azul.jpe');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    button { font-family: inherit; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
    }
    #canvas-container canvas { display: block; touch-action: none; }

    /* Título superior brillante */
    .header-title {
      position: fixed;
      top: 25px;
      width: 100%;
      padding: 0 16px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .header-title h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.1rem, 6vw, 3.2rem);
      line-height: 1.15;
      color: #28086b;
      text-shadow: 0 0 15px rgba(13, 161, 227, 0.7), 0 4px 10px rgba(0,0,0,0.8);
    }
    .subtitle-hint {
      font-size: clamp(0.78rem, 2.4vw, 0.9rem);
      color: #201b83;
      opacity: 0.9;
      margin-top: 5px;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    /* Controles flotantes del Pastel */
    .cake-controls {
      position: fixed;
      bottom: 35px;
      width: 100%;
      padding: 0 16px;
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      z-index: 20;
    }
    .btn-gold {
      background: linear-gradient(45deg, #d4af37, #f9e29c, #d4af37);
      color: #2b0a3d;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
      transition: transform 0.2s;
    }
    .btn-gold:hover { transform: scale(1.06); }
    .btn-dark {
      background: rgba(30, 10, 45, 0.85);
      color: #ffd700;
      border: 1px solid #ffd700;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-dark:hover { transform: scale(1.06); }

    /* Modales (Carta y Ruleta de Fotos) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 2, 20, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 20px;
    }

    /* Diseño de la Carta */
    .letter-card {
      background: linear-gradient(135deg, #fffdf7 0%, #f7ebd2 100%);
      color: #3a2312;
      width: 100%;
      max-width: 460px;
      max-height: 92vh;
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 35px 30px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
      position: relative;
      text-align: center;
      animation: zoomIn 0.4s ease;
    }
    .letter-badge {
      background: #9b111e;
      color: #ffd700;
      font-size: 0.75rem;
      padding: 5px 15px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .letter-card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.3rem;
      line-height: 1.15;
      color: #9b1111;
      margin-bottom: 15px;
    }
    .letter-body {
      font-size: 0.95rem;
      line-height: 1.65;
      text-align: left;
      margin-bottom: 20px;
      color: #4a301d;
    }
    .letter-sign {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #9b1111;
      text-align: right;
      margin-bottom: 20px;
    }

    /* Diseño de la Ruleta 3D de Recuerdos */
    .carousel-box {
      background: linear-gradient(180deg, #25083b 0%, #12031f 100%);
      border: 2px solid #d4af37;
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 96vh;
      max-height: 96dvh;
      overflow: hidden;
      padding: 25px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.25);
      animation: zoomIn 0.4s ease;
    }
    .carousel-box h2 {
      font-family: 'Cinzel', serif;
      color: #ffd700;
      font-size: 1.4rem;
      margin: 0 28px 5px;
    }
    .carousel-stage {
      perspective: 1000px;
      height: 375px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      position: relative;
    }
    .memory-card {
      width: 220px;
      height: 350px;
      background: #fff;
      border-radius: 14px;
      padding: 10px 10px 14px 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      position: absolute;
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      color: #222;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .memory-card img {
      width: 100%;
      height: 180px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }
    .memory-card p {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: 1.05rem;
      line-height: 1.2;
      color: #9b111e;
      overflow-y: auto;
    }
    .nav-arrows {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
    }
    .arrow-btn {
      background: #ffd700;
      color: #25083b;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .arrow-btn:hover { transform: scale(1.1); }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      background: rgba(0,0,0,0.2);
      color: #d4af37;
      border: 1px solid #d4af37;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      z-index: 2;
    }
    .letter-card .close-btn { position: sticky; float: right; top: -20px; margin: -20px -15px 0 0; }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* --- ESTILOS PARA MEDUSAS Y FOCAS FLOTANTES --- */
    .sticker-flotante {
      position: fixed;
      z-index: 5; /* Detrás de los botones/modales, pero visibles sobre el fondo */
      pointer-events: none;
      height: auto;
      animation: flotarSutil 4s ease-in-out infinite;
    }
    /* 1. Arriba a la izquierda */
    .pos-1 { top: 10%; left: 4%; width: clamp(70px, 11vw, 150px); animation-delay: 0s; }
    /* 2. Medio-izquierda */
    .pos-2 { top: 30%; left: 16%; width: clamp(80px, 13vw, 180px); animation-delay: 1s; }
    /* 3. Arriba a la derecha */
    .pos-3 { top: 22%; right: 12%; width: clamp(85px, 14vw, 190px); animation-delay: 0.5s; }
    /* 4. Medio-derecha */
    .pos-4 { top: 53%; right: 11%; width: clamp(65px, 10vw, 140px); animation-delay: 1.5s; }
    /* 5. Abajo a la derecha */
    .pos-5 { bottom: 8%; right: 4%; width: clamp(85px, 14vw, 190px); animation-delay: 2s; }

    @keyframes flotarSutil {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-14px) rotate(4deg); }
    }

    @media (max-width: 480px) {
      .letter-card { padding: 30px 20px; }
      .letter-card h2 { font-size: 2rem; }
      .carousel-box { padding: 20px 14px; }
      .carousel-stage { height: 355px; }
      .memory-card { width: 195px; height: 335px; }
      .memory-card img { height: 165px; }
      .sticker-flotante { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sticker-flotante { animation: none; }
      .memory-card { transition: none; }
    }
  </style>
</head>
<body>

  <!-- TÍTULO SUPERIOR -->
  <div class="header-title">
    <h1 id="mainTitle">¡Feliz Cumpleaños!</h1>
    <div class="subtitle-hint" id="hintText">✨ Toca la caja para abrir tu regalo (puedes girarla con el dedo o mouse) ✨</div>
  </div>

  <!-- ESCENARIO 3D -->
  <div id="canvas-container"></div>

  <!-- MEDUSAS Y FOCAS EN LAS POSICIONES DE TUS CÍRCULOS -->
  <img src="Yuki-Seal.jpe.png" class="sticker-flotante pos-1" alt="Foca" onerror="this.style.display='none'">
  <img src="medusa-3.png" class="sticker-flotante pos-2" alt="Medusa" onerror="this.style.display='none'">
  <img src="medusa-azul.jpe.png" class="sticker-flotante pos-3" alt="Medusa" onerror="this.style.display='none'">
  <img src="Yo-Seal.jpe.png" class="sticker-flotante pos-4" alt="Foca" onerror="this.style.display='none'">
  <img src="medusa-2.png" class="sticker-flotante pos-5" alt="Medusa" onerror="this.style.display='none'">

  <!-- BOTONES DEL PASTEL -->
  <div class="cake-controls" id="cakeControls">
    <button class="btn-gold" id="toggleCandlesBtn" onclick="toggleVelas()">💨 Soplar las Velas</button>
    <button class="btn-dark" onclick="volverALaCaja()">🎁 Volver a la Caja</button>
  </div>

  <!-- MODAL DE LA CARTA -->
  <div class="modal-overlay" id="letterModal" role="dialog" aria-modal="true" aria-label="Carta de cumpleaños">
    <div class="letter-card">
      <button class="close-btn" onclick="cerrarModales()" aria-label="Cerrar">✕</button>
      <div class="letter-badge" id="letterBadge">CARTA PARA TI ♡</div>
      <h2 id="letterTitle"></h2>
      <div class="letter-body" id="letterText"></div>
      <div class="letter-sign" id="letterSignature"></div>
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="btn-dark" id="nextLetterBtn" onclick="cambiarCarta()">💌 Ver la otra carta</button>
        <button class="btn-gold" onclick="lanzarCelebracion()">🎉 ¡Celebrar!</button>
        <button class="btn-dark" onclick="abrirRecuerdos()">📸 Ver Imágenes</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE RULETA DE FOTOS -->
  <div class="modal-overlay" id="galleryModal" role="dialog" aria-modal="true" aria-label="Galería de recuerdos">
    <div class="carousel-box">
      <button class="close-btn" onclick="cerrarModales()" aria-label="Cerrar">✕</button>
      <h2>¡Imágenes que me recuerdan a ti!</h2>
      <p style="font-size: 0.8rem; color: #d8b4e2;">Usa las flechas para girar</p>

      <div class="carousel-stage" id="carouselStage"></div>

      <div class="nav-arrows">
        <button class="arrow-btn" onclick="moverRuleta(-1)" aria-label="Anterior">◀</button>
        <button class="arrow-btn" onclick="moverRuleta(1)" aria-label="Siguiente">▶</button>
      </div>

      <button class="btn-gold" onclick="lanzarCelebracion()">🎈 Lanzar Confeti y Celebrar</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // 🎨 ZONA DE PERSONALIZACIÓN (EDITA SOLO ESTO PARA HACERLO A TU ESTILO)
    // =========================================================================
    const CONFIG = {
      tituloPrincipal: "¡Feliz Cumpleaños, Félix!",
      textoTapaCaja: "¡Feliz Cumpleaños!\nPara ti ଳ",

      // 💌 CARTAS (se alternan con el botón "Ver la otra carta"):
      cartas: [
        {
          titulo: "Querido Félix...",
          mensaje: `El día de hoy cumple años alguien especial para mí, y ese eres tú. Agradezco tanto a Dios por permitirte otro año más de vida.<br><br>
          Y permitirme a mí tenerte a mi lado. Gracias por todo, por tu cariño, los chismes, tu amistad, tus bobadas, hasta tu amor por las patas jaja... Por estar siempre ahí cuando hace falta, cuando más lo necesito, y por tu inmesa leatad.  No tienes ni idea lo importarte que eres para mi, a tal punto de llegar a soñar contigo, Félix. Me pondria más sentimental, pero no existe palabras ni cantidad de lineas de código que exprese mi cariño por ti.<br><br>
          Que este nuevo año venga cargado de éxitos, salud y felicidad, mi querido Lixie.<br><br>
          ¡Disfruta tu día al máximo! Besos y abrazos ♡`,
          firma: "Tu amiga y con mucho amor, Beel ☆"
        },
        {
          titulo: "¡Feliz Cumpleaños, Félix ۶۟ৎ!",
          mensaje: `Como sabrás, hoy tienes 19 añitos y quería prepararte este pequeño detalle, y más te valga que te guste 𑄝੭.<br><br>
          Gracias por todo, por tu mera existencia. Ya que haberte conocido es una de las grandes maravillas de mi vida. Que esta nueva etapa de adulto joven te traiga muchísima salud y metas cumplidas.<br><br>
          La vida es difícil, pero al menos me tienes a mí, como yo a ti. ദ്ദി◝ ⩊ ◜.ᐟ <br><br>
          ¡Disfruta tu día, te lo mereces, mwa!`,
          firma: "Con mucho amor, Beel ♡"
        }
      ],

      // 📸 FOTOS DE LA RULETA:
      recuerdos: [
        { img: "ChuFei.jpe", frase: "Tienes tanta energía que siento que en cualquier momento me vas a mirar con cara de pocos amigos por hacer una tontería, aunque igual me cubras las espaldas." },
        { img: "Niko.jpe", frase: "No llores, solo eres una foca intentando sobrevivir. ¿Sabias que Niko significa sonreir? Apesar de ser una foca malcriada." },
        { img: "LiriosLixie.jpe", frase: "Existen miles de significados, pero los lirios florecen cuando les sonríes con tanta devoción." },
        { img: "ofTheOpera.jpe", frase: "En la vida hay que acostumbrarse a todo, incluso a la eternidad. Frase de esta obra; obra que me recuerda a ti, esclavos del amor." }
      ]
    };
    // =========================================================================

    document.getElementById("mainTitle").innerText = CONFIG.tituloPrincipal;
    // --- CARTAS (alternan entre las dos) ---
    let cartaActual = 0;
    function mostrarCarta(i) {
      const total = CONFIG.cartas.length;
      cartaActual = (i + total) % total;
      const c = CONFIG.cartas[cartaActual];
      document.getElementById("letterBadge").innerText = `CARTA ${cartaActual + 1} DE ${total} ♡`;
      document.getElementById("letterTitle").innerText = c.titulo;
      document.getElementById("letterText").innerHTML = c.mensaje;
      document.getElementById("letterSignature").innerText = c.firma;
      document.getElementById("nextLetterBtn").style.display = total > 1 ? '' : 'none';
      document.querySelector('.letter-card').scrollTop = 0;
    }
    function cambiarCarta() { mostrarCarta(cartaActual + 1); }
    mostrarCarta(0);

    // --- CONFIGURACIÓN ESCENA 3D (THREE.JS) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const HOME_POS = new THREE.Vector3(0, 5.5, 9.5);
    const HOME_TARGET = new THREE.Vector3(0, 0, 0);
    const CAKE_POS = new THREE.Vector3(-0.75, 2.2, 2.6);
    const CAKE_TARGET = new THREE.Vector3(-0.75, 0.2, -0.3);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(HOME_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.minDistance = 4;
    controls.maxDistance = 15;

    // Ajusta el encuadre en pantallas angostas (celular) para que la caja quepa completa
    function ajustarEncuadre() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.fov = camera.aspect < 0.8 ? 60 : 45;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    ajustarEncuadre();

    // Luces
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));

    const spotLight = new THREE.SpotLight(0xffeaad, 1.4);
    spotLight.position.set(5, 12, 7);
    scene.add(spotLight);

    const pointLight = new THREE.PointLight(0xff4d94, 0.8, 20);
    pointLight.position.set(-5, 4, -5);
    scene.add(pointLight);

    // Materiales
    const redBoxMat = new THREE.MeshStandardMaterial({ color: 0x2f3988, roughness: 0.35, metalness: 0.1 });
    const innerBoxMat = new THREE.MeshStandardMaterial({ color: 0x6e0814, roughness: 0.6 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.25, metalness: 0.8 });

    // Base circular dorada debajo de la caja
    const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.2, 48), goldMat);
    pedestal.position.y = -1.3;
    scene.add(pedestal);

    // Grupo principal de la Caja
    const giftGroup = new THREE.Group();
    scene.add(giftGroup);

    // Paredes de la caja (hueca por dentro)
    const wallThickness = 0.18;
    const boxW = 3.6, boxH = 2.2, boxD = 3.6;

    const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(boxW, wallThickness, boxD), innerBoxMat);
    floorMesh.position.y = -boxH / 2;
    giftGroup.add(floorMesh);

    const frontWall = new THREE.Mesh(new THREE.BoxGeometry(boxW, boxH, wallThickness), redBoxMat);
    frontWall.position.z = boxD / 2;
    giftGroup.add(frontWall);

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(boxW, boxH, wallThickness), redBoxMat);
    backWall.position.z = -boxD / 2;
    giftGroup.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, boxH, boxD), redBoxMat);
    leftWall.position.x = -boxW / 2;
    giftGroup.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, boxH, boxD), redBoxMat);
    rightWall.position.x = boxW / 2;
    giftGroup.add(rightWall);

    // Cintas doradas SOLO por fuera de las paredes
    const ribbonFront = new THREE.Mesh(new THREE.BoxGeometry(0.45, boxH + 0.02, 0.04), goldMat);
    ribbonFront.position.z = boxD / 2 + 0.09;
    giftGroup.add(ribbonFront);

    const ribbonBack = new THREE.Mesh(new THREE.BoxGeometry(0.45, boxH + 0.02, 0.04), goldMat);
    ribbonBack.position.z = -boxD / 2 - 0.09;
    giftGroup.add(ribbonBack);

    const ribbonLeft = new THREE.Mesh(new THREE.BoxGeometry(0.04, boxH + 0.02, 0.45), goldMat);
    ribbonLeft.position.x = -boxW / 2 - 0.09;
    giftGroup.add(ribbonLeft);

    const ribbonRight = new THREE.Mesh(new THREE.BoxGeometry(0.04, boxH + 0.02, 0.45), goldMat);
    ribbonRight.position.x = boxW / 2 + 0.09;
    giftGroup.add(ribbonRight);

    const lockMesh = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.25), goldMat);
    lockMesh.position.set(0, 0.2, boxD / 2 + 0.12);
    giftGroup.add(lockMesh);

    // TAPA DE LA CAJA
    const lidPivot = new THREE.Group();
    lidPivot.position.set(0, boxH / 2, -boxD / 2);
    giftGroup.add(lidPivot);

    const lidMesh = new THREE.Mesh(new THREE.BoxGeometry(boxW + 0.25, 0.4, boxD + 0.25), redBoxMat);
    lidMesh.position.set(0, 0.2, boxD / 2);
    lidPivot.add(lidMesh);

    const lidRibbon1 = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.44, boxD + 0.28), goldMat);
    lidRibbon1.position.set(0, 0.2, boxD / 2);
    lidPivot.add(lidRibbon1);

    const lidRibbon2 = new THREE.Mesh(new THREE.BoxGeometry(boxW + 0.28, 0.44, 0.48), goldMat);
    lidRibbon2.position.set(0, 0.2, boxD / 2);
    lidPivot.add(lidRibbon2);

    // Texto en la tapa (se redibuja cuando la fuente termina de cargar)
    function dibujarPlaca(ctx, texto) {
      ctx.fillStyle = '#8a0c1a';
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 12;
      ctx.strokeRect(10, 10, 492, 236);
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 42px Poppins, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lines = texto.split('\n');
      const startY = 128 - ((lines.length - 1) * 55) / 2;
      lines.forEach((l, i) => ctx.fillText(l, 256, startY + i * 55));
    }
    function crearTexturaTexto(texto) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 256;
      const ctx = c.getContext('2d');
      dibujarPlaca(ctx, texto);
      const tex = new THREE.CanvasTexture(c);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { dibujarPlaca(ctx, texto); tex.needsUpdate = true; });
      }
      return tex;
    }
    const plaque = new THREE.Mesh(
      new THREE.PlaneGeometry(2.1, 1.05),
      new THREE.MeshBasicMaterial({ map: crearTexturaTexto(CONFIG.textoTapaCaja) })
    );
    plaque.rotation.x = -Math.PI / 2;
    plaque.position.set(0, 0.43, boxD / 2 + 0.35);
    lidPivot.add(plaque);

    // --- OBJETOS INTERACTIVOS DENTRO DE LA CAJA ---
    const interactiveObjects = [];

    // 1. PASTEL 3D
    const cakeGroup = new THREE.Group();
    cakeGroup.position.set(-0.75, -0.5, -0.3);
    giftGroup.add(cakeGroup);

    const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.08, 32), goldMat);
    cakeGroup.add(plate);

    const tier1 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.68, 0.68, 0.45, 32),
      new THREE.MeshStandardMaterial({ color: 0xfff0f5, roughness: 0.4 })
    );
    tier1.position.y = 0.25;
    cakeGroup.add(tier1);

    const tier2 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.38, 32),
      new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.4 })
    );
    tier2.position.y = 0.65;
    cakeGroup.add(tier2);

    const flames = [];
    const candleColors = [0xff4757, 0x1e90ff, 0x2ed573, 0xffa502];
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      const candle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 0.28, 12),
        new THREE.MeshStandardMaterial({ color: candleColors[i] })
      );
      candle.position.set(Math.cos(angle) * 0.22, 0.96, Math.sin(angle) * 0.22);
      cakeGroup.add(candle);

      const flame = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 10, 10),
        new THREE.MeshBasicMaterial({ color: 0xffdd00 })
      );
      flame.scale.set(0.7, 1.5, 0.7);
      flame.position.set(Math.cos(angle) * 0.22, 1.15, Math.sin(angle) * 0.22);
      cakeGroup.add(flame);
      flames.push(flame);
    }
    cakeGroup.traverse(obj => { if (obj.isMesh) obj.userData = { action: 'cake' }; });
    interactiveObjects.push(cakeGroup);

    // 2. CÁMARA DE RECUERDOS 3D
    const camGroup = new THREE.Group();
    camGroup.position.set(0.85, -0.55, 0.3);
    camGroup.rotation.y = -0.4;
    giftGroup.add(camGroup);

    const camBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.85, 0.55, 0.35),
      new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 })
    );
    camGroup.add(camBody);

    const camLens = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.22, 0.25, 24),
      goldMat
    );
    camLens.rotation.x = Math.PI / 2;
    camLens.position.z = 0.22;
    camGroup.add(camLens);

    camGroup.traverse(obj => { if (obj.isMesh) obj.userData = { action: 'gallery' }; });
    interactiveObjects.push(camGroup);

    // 3. CARTA / SOBRE DORADO
    const envGroup = new THREE.Group();
    envGroup.position.set(-0.3, -0.75, 0.85);
    envGroup.rotation.set(-0.3, 0.2, 0);
    giftGroup.add(envGroup);

    const envMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.95, 0.06, 0.65),
      new THREE.MeshStandardMaterial({ color: 0xfff8dc })
    );
    envGroup.add(envMesh);

    const sealMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 20), redBoxMat);
    sealMesh.position.y = 0.02;
    envGroup.add(sealMesh);

    envGroup.traverse(obj => { if (obj.isMesh) obj.userData = { action: 'letter' }; });
    interactiveObjects.push(envGroup);

    // --- GLOBOS FLOTANTES DECORATIVOS (ahora con su hilito) ---
    const balloons = [];
    const balloonColors = [0xff4757, 0xffd700, 0x9b59b6, 0xff6b81, 0x00d2d3];
    const stringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
    for (let i = 0; i < 8; i++) {
      const bGroup = new THREE.Group();
      const bMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 24, 24),
        new THREE.MeshStandardMaterial({ color: balloonColors[i % balloonColors.length], roughness: 0.2 })
      );
      bMesh.scale.set(0.9, 1.15, 0.9);
      bGroup.add(bMesh);

      const bString = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 6), stringMat);
      bString.position.y = -1;
      bGroup.add(bString);

      const angle = (i / 8) * Math.PI * 2;
      bGroup.position.set(Math.cos(angle) * 4.2, -3, Math.sin(angle) * 4.2);
      bGroup.userData = { targetY: 2.5 + (i % 3) * 0.8, offset: i };
      bGroup.visible = false;
      scene.add(bGroup);
      balloons.push(bGroup);
    }

    // --- ✨ ESTRELLITAS DORADAS FLOTANTES (PARTÍCULAS MÁGICAS) ---
    function crearTexturaEstrella() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      // Estrella de 4 puntas brillante
      ctx.moveTo(32, 4);
      ctx.quadraticCurveTo(32, 32, 60, 32);
      ctx.quadraticCurveTo(32, 32, 32, 60);
      ctx.quadraticCurveTo(32, 32, 4, 32);
      ctx.quadraticCurveTo(32, 32, 32, 4);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    const starTexture = crearTexturaEstrella();
    const stars = [];
    for (let i = 0; i < 45; i++) {
      const starMat = new THREE.SpriteMaterial({ map: starTexture, transparent: true, depthWrite: false });
      const star = new THREE.Sprite(starMat);
      const size = 0.18 + Math.random() * 0.22;
      star.scale.set(size, size, 1);

      const radius = 1.8 + Math.random() * 4.2;
      const angle = Math.random() * Math.PI * 2;
      star.position.set(Math.cos(angle) * radius, -0.5 + Math.random() * 4.5, Math.sin(angle) * radius);

      star.userData = {
        speedY: 0.006 + Math.random() * 0.01,
        blinkSpeed: 2 + Math.random() * 3,
        offset: Math.random() * 10
      };
      scene.add(star);
      stars.push(star);
    }

    // --- FOCAS DE CUMPLEAÑOS ALREDEDOR (SPRITES 2D) ---
    // Solo se crean si la imagen carga bien (así no aparecen cuadros blancos si falta el archivo)
    const elementosFondo = [];
    new THREE.TextureLoader().load(
      'BirthdaySeal.png',
      (textura) => {
        const totalObjetos = 8;
        const radio = 4.5;
        for (let i = 0; i < totalObjetos; i++) {
          const angulo = (i / totalObjetos) * Math.PI * 2;
          const escala = (i % 2 === 0) ? 1.2 : 1.5;

          const material = new THREE.SpriteMaterial({ map: textura, transparent: true });
          const sprite = new THREE.Sprite(material);
          sprite.scale.set(escala, escala, 1);
          sprite.position.set(Math.cos(angulo) * radio, -0.8, Math.sin(angulo) * radio);
          scene.add(sprite);

          elementosFondo.push({ mesh: sprite, baseY: -0.8, offsetY: i, velocidad: 1.5 + (i * 0.2) });
        }
      },
      undefined,
      () => console.warn('No se encontró BirthdaySeal.png (junto al HTML).')
    );

    // --- ESTADOS DE ANIMACIÓN ---
    let isBoxOpen = false;
    let candlesLit = true;
    let camGoal = null;   // transición suave de cámara
    let camFrames = 0;

    function moverCamara(pos, target) {
      camGoal = { pos, target };
      camFrames = 110; // ~1.8 s; después el usuario vuelve a controlar la cámara libremente
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Se detecta un "toque" solo si el dedo/mouse casi no se movió,
    // así girar la caja ya no la abre ni activa objetos por accidente.
    let downX = 0, downY = 0;
    renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
    renderer.domElement.addEventListener('pointerup', (event) => {
      if (Math.hypot(event.clientX - downX, event.clientY - downY) > 6) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (!isBoxOpen) {
        if (raycaster.intersectObjects(giftGroup.children, true).length > 0) abrirCajaSorpresa();
      } else {
        const hits = raycaster.intersectObjects(interactiveObjects, true);
        if (hits.length > 0) {
          const action = hits[0].object.userData.action;
          if (action === 'cake') enfocarPastel();
          if (action === 'gallery') abrirRecuerdos();
          if (action === 'letter') abrirCarta();
        }
      }
    });

    const HINT_ABIERTA = "🎂 Toca el Pastel, 📸 la Cámara o 💌 la Carta dentro de la caja";

    function abrirCajaSorpresa() {
      isBoxOpen = true;
      document.getElementById('hintText').innerText = HINT_ABIERTA;
      balloons.forEach(b => b.visible = true);
      lanzarCelebracion();
    }

    function enfocarPastel() {
      document.getElementById('cakeControls').style.display = 'flex';
      document.getElementById('hintText').innerText = "¡Pide un deseo y sopla las velas! :D";
      moverCamara(CAKE_POS, CAKE_TARGET);
    }

    function volverALaCaja() {
      document.getElementById('cakeControls').style.display = 'none';
      document.getElementById('hintText').innerText = HINT_ABIERTA;
      moverCamara(HOME_POS, HOME_TARGET); // ahora la cámara sí regresa a su sitio
    }

    function toggleVelas() {
      candlesLit = !candlesLit;
      flames.forEach(f => f.visible = candlesLit);
      const btn = document.getElementById('toggleCandlesBtn');
      if (candlesLit) {
        btn.innerText = "💨 Soplar las Velas";
      } else {
        btn.innerText = "🔥 Encender las Velas";
        lanzarCelebracion();
      }
    }

    function abrirCarta() {
      mostrarCarta(0);
      document.getElementById('letterModal').style.display = 'flex';
    }

    function abrirRecuerdos() {
      cerrarModales();
      document.getElementById('galleryModal').style.display = 'flex';
      renderRuleta(); // después de mostrar el modal, para medir bien su ancho
    }

    function cerrarModales() {
      document.getElementById('letterModal').style.display = 'none';
      document.getElementById('galleryModal').style.display = 'none';
    }

    function lanzarCelebracion() {
      confetti({
        particleCount: 90,
        spread: 75,
        origin: { y: 0.6 },
        colors: ['#ffd700', '#ff4757', '#ff6b81', '#ffffff'],
        zIndex: 100
      });
    }

    // --- LÓGICA DE LA RULETA 3D DE FOTOS ---
    let currentIndex = 0;
    function renderRuleta() {
      const stage = document.getElementById('carouselStage');
      stage.innerHTML = '';
      const total = CONFIG.recuerdos.length;
      const spread = Math.min(135, stage.clientWidth * 0.3 || 135);

      CONFIG.recuerdos.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'memory-card';

        const img = document.createElement('img');
        img.src = item.img;
        img.alt = 'Recuerdo';
        const frase = document.createElement('p');
        frase.textContent = item.frase;
        card.append(img, frase);

        let diff = (idx - currentIndex + total) % total;
        if (diff > total / 2) diff -= total;

        if (diff === 0) {
          card.style.transform = 'translateX(0) scale(1.03) rotateY(0deg)';
          card.style.zIndex = 10;
          card.style.opacity = 1;
        } else if (diff === -1) {
          card.style.transform = `translateX(-${spread}px) scale(0.82) rotateY(25deg)`;
          card.style.zIndex = 5;
          card.style.opacity = 0.75;
        } else if (diff === 1) {
          card.style.transform = `translateX(${spread}px) scale(0.82) rotateY(-25deg)`;
          card.style.zIndex = 5;
          card.style.opacity = 0.75;
        } else {
          card.style.transform = 'translateX(0) scale(0.5)';
          card.style.zIndex = 1;
          card.style.opacity = 0;
        }

        stage.appendChild(card);
      });
    }

    function moverRuleta(dir) {
      const total = CONFIG.recuerdos.length;
      currentIndex = (currentIndex + dir + total) % total;
      renderRuleta();
    }

    // Teclado: Esc cierra, flechas giran la ruleta
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') cerrarModales();
      if (document.getElementById('galleryModal').style.display === 'flex') {
        if (e.key === 'ArrowLeft') moverRuleta(-1);
        if (e.key === 'ArrowRight') moverRuleta(1);
      }
    });

    // --- BUCLE DE ANIMACIÓN PRINCIPAL ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (!isBoxOpen) {
        giftGroup.rotation.y = Math.sin(t * 0.8) * 0.35;
      } else {
        // La caja se endereza suavemente al abrirse (antes quedaba torcida)
        giftGroup.rotation.y = THREE.MathUtils.lerp(giftGroup.rotation.y, 0, 0.05);
        lidPivot.rotation.x = THREE.MathUtils.lerp(lidPivot.rotation.x, -Math.PI * 0.62, 0.06);

        cakeGroup.position.y = -0.45 + Math.sin(t * 2.5) * 0.06;
        camGroup.position.y = -0.5 + Math.cos(t * 2.5) * 0.06;
        envGroup.position.y = -0.7 + Math.sin(t * 3) * 0.05;

        balloons.forEach(b => {
          b.position.y = THREE.MathUtils.lerp(b.position.y, b.userData.targetY + Math.sin(t * 2 + b.userData.offset) * 0.3, 0.03);
        });
      }

      if (candlesLit) {
        flames.forEach((f, i) => {
          f.scale.y = 1.4 + Math.sin(t * 15 + i) * 0.25;
        });
      }

      if (camGoal && camFrames > 0) {
        camera.position.lerp(camGoal.pos, 0.07);
        controls.target.lerp(camGoal.target, 0.07);
        camFrames--;
      }

      // Animar focas de fondo
      elementosFondo.forEach((item) => {
        item.mesh.position.y = item.baseY + Math.sin(t * item.velocidad + item.offsetY) * 0.15;
      });

      // ✨ Animar estrellitas flotantes (suben y parpadean)
      stars.forEach((star) => {
        star.position.y += star.userData.speedY;
        if (star.position.y > 4.5) star.position.y = -0.8;
        star.material.opacity = 0.3 + Math.abs(Math.sin(t * star.userData.blinkSpeed + star.userData.offset)) * 0.7;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ajustarEncuadre);
  </script>
</body>
</html>
